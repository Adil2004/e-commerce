apiVersion: v1
kind: Service
metadata:
  name: react
  labels:
    app: react
spec:
  type: ClusterIP
  selector:
    app: react
    tier: frontend
  ports:
    - port: 5173
      targetPort: 5173

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: react
  labels:
    app: react
spec:
  replicas: 1
  selector:
    matchLabels:
      app: react
      tier: frontend
  template:
      metadata:
        labels:
          app: react
          tier: frontend
      spec:
        containers:
         - image: react-app:v3
           name: react
           imagePullPolicy: IfNotPresent
           ports:
             - containerPort: 5173
