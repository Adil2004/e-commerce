apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ecommerce-ingress
  namespace: default
spec:
  ingressClassName: nginx
  rules:
    - host: django.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: django
                port:
                  number: 8000
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: django
                port:
                  number: 8000
          - path: /media
            pathType: Prefix
            backend:
              service:
                name: django
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: react
                port:
                  number: 5173